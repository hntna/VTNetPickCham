<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - VTNet Pickleball Championship 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=3">
  <style>
    /* Admin Match Cards */
    .admin-match-card {
      background: var(--white);
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-lg);
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: border-color 0.3s;
    }
    .admin-match-card.bye { opacity: 0.4; pointer-events: none; }
    .admin-match-teams { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .admin-match-team {
      font-weight: 600;
      font-size: 12px;
      color: var(--gray-800);
      text-align: center;
      line-height: 1.3;
    }
    .admin-match-score-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .admin-match-score-row .score-input {
      width: 56px;
      height: 48px;
      font-size: 22px;
    }
    .admin-match-score-row .score-vs {
      font-size: 16px;
      font-weight: 900;
      color: var(--gray-400);
    }
    .btn-save-one {
      background: var(--gray-50);
      border: 2px solid var(--gray-200);
      border-radius: var(--radius);
      width: 44px;
      height: 44px;
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .btn-save-one:hover { background: var(--primary-bg); border-color: var(--primary); }
    .admin-tabs {
      display: flex;
      margin-bottom: 20px;
      gap: 10px;
      border-bottom: 2px solid var(--gray-200);
      padding-bottom: 10px;
    }
    .admin-tab {
      padding: 10px 20px;
      border: none;
      background: none;
      font-size: 16px;
      font-weight: 600;
      color: var(--gray-500);
      cursor: pointer;
      border-radius: var(--radius);
      transition: all 0.2s;
    }
    .admin-tab:hover { background: var(--gray-100); }
    .admin-tab.active { background: var(--primary); color: white; }
    .admin-section { display: none; }
    .admin-section.active { display: block; }
    .home-link {
      display: inline-block;
      margin-bottom: 10px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    .home-link:hover { text-decoration: underline; }
    .team-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .team-row input { flex: 1; }
    .btn-delete {
      width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      color: #DC2626; border: 2px solid #DC2626; border-radius: var(--radius); background: none; cursor: pointer;
      font-size: 18px; transition: all 0.2s;
    }
    .btn-delete:hover { background: #FEE2E2; }
    .btn-delete:active { transform: scale(0.95); }
    .btn-save-one:active { transform: scale(0.95); }

    @media (min-width: 768px) {
      .admin-match-teams { flex-direction: row; align-items: center; }
      .admin-match-team { flex: 1; font-size: 13px; }
      .admin-match-team:first-child { text-align: right; }
      .admin-match-team:last-child { text-align: left; }
      .admin-match-score-row { flex-shrink: 0; }
    }
  </style>
</head>
<body>

  <!-- Login Section -->
  <div id="admin-login-section" class="admin-login">
    <div class="login-card">
      <div style="text-align:center;font-size:48px;margin-bottom:12px">🔐</div>
      <h1 class="login-card__title">Admin Login</h1>
      <p class="login-card__sub">VTNet Pickleball Championship 2026</p>
      <div id="login-error" class="login-error"></div>
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" type="email" id="email" placeholder="admin@vtnet.vn" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Mật khẩu / Password</label>
          <input class="form-input" type="password" id="password" placeholder="••••••••" required>
        </div>
        <button class="btn btn-primary" type="submit">Đăng nhập / Login</button>
      </form>
    </div>
  </div>

  <!-- Dashboard Section -->
  <div id="admin-dashboard" class="admin-dashboard">
    <header class="admin-header">
      <div class="admin-user">👋 <span id="admin-email"></span></div>
      <button class="btn btn-outline" id="logout-btn" style="width:auto;padding:8px 16px;font-size:13px">Đăng xuất</button>
    </header>

    <div class="admin-content">
      <a href="index.html" class="home-link">← Quay về Trang Chủ</a>
      
      <div class="admin-tabs">
        <button class="admin-tab active" data-tab="scores">Quản lý Tỷ số</button>
        <button class="admin-tab" data-tab="teams">Quản lý Đội</button>
      </div>

      <!-- SCORES SECTION -->
      <div id="scores-section" class="admin-section active">
        <div class="admin-card">
          <h2 class="admin-card__title">📋 Chọn vòng đấu / Select Round</h2>
          <select class="form-select" id="round-select">
            <option value="">-- Chọn vòng đấu --</option>
          </select>
        </div>
        <div id="matches-container"></div>
      </div>

      <!-- TEAMS SECTION -->
      <div id="teams-section" class="admin-section">
        <div class="admin-card">
          <h2 class="admin-card__title">👥 Quản lý Danh sách Đội</h2>
          <p style="color:var(--gray-500);font-size:14px;margin-bottom:16px;">Chọn bảng để Import hoặc tự chỉnh sửa danh sách bên dưới.</p>
          
          <div style="margin-bottom: 20px; padding: 12px; background: var(--gray-50); border-radius: 8px; border: 1px solid var(--gray-200);">
            <h3 style="font-size:15px; margin-bottom:8px;">📥 Import Hàng Loạt</h3>
            <select class="form-select" id="import-group-select" style="margin-bottom: 8px;">
              <option value="1">Bảng 1</option><option value="2">Bảng 2</option>
              <option value="3">Bảng 3</option><option value="4">Bảng 4</option>
              <option value="5">Bảng 5</option><option value="6">Bảng 6</option>
            <textarea id="import-textarea" class="form-input" style="height: 100px; resize: vertical;" placeholder="Dán danh sách đội (mỗi đội 1 dòng)&#10;Ví dụ: Nguyễn Văn A / Trần Thị B..."></textarea>
            <button class="btn btn-outline" style="margin-top:8px" onclick="importTeams()">Import vào Bảng này</button>
          </div>

          <div id="teams-container"></div>

          <button class="btn btn-primary" style="margin-top:20px" onclick="saveAllTeams()">💾 Lưu Tất Cả Đội Lên Server</button>
        </div>
      </div>
    </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

  <!-- App Scripts -->
  <script src="js/data.js?v=14"></script>
  <script src="js/firebase-config.js?v=14"></script>
  <script src="js/group-stage.js?v=14"></script>
  <script src="js/knockout.js?v=14"></script>
  <script src="js/admin.js?v=14"></script>

</body>
</html>
