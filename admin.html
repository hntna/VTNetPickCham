<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - VTNet Pickleball Championship 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Admin Match Cards */
    .admin-match-card {
      background: var(--white);
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-lg);
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: border-color 0.3s;
    }
    .admin-match-card.bye { opacity: 0.4; pointer-events: none; }
    .admin-match-teams { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .admin-match-team {
      font-weight: 600;
      font-size: 12px;
      color: var(--gray-800);
      text-align: center;
      line-height: 1.3;
    }
    .admin-match-score-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .admin-match-score-row .score-input {
      width: 56px;
      height: 48px;
      font-size: 22px;
    }
    .admin-match-score-row .score-vs {
      font-size: 16px;
      font-weight: 900;
      color: var(--gray-400);
    }
    .btn-save-one {
      background: var(--gray-50);
      border: 2px solid var(--gray-200);
      border-radius: var(--radius);
      width: 44px;
      height: 44px;
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .btn-save-one:hover { background: var(--primary-bg); border-color: var(--primary); }
    .btn-save-one:active { transform: scale(0.95); }

    @media (min-width: 768px) {
      .admin-match-teams { flex-direction: row; align-items: center; }
      .admin-match-team { flex: 1; font-size: 13px; }
      .admin-match-team:first-child { text-align: right; }
      .admin-match-team:last-child { text-align: left; }
      .admin-match-score-row { flex-shrink: 0; }
    }
  </style>
</head>
<body>

  <!-- Login Section -->
  <div id="admin-login-section" class="admin-login">
    <div class="login-card">
      <div style="text-align:center;font-size:48px;margin-bottom:12px">🔐</div>
      <h1 class="login-card__title">Admin Login</h1>
      <p class="login-card__sub">VTNet Pickleball Championship 2026</p>
      <div id="login-error" class="login-error"></div>
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" type="email" id="email" placeholder="admin@vtnet.vn" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Mật khẩu / Password</label>
          <input class="form-input" type="password" id="password" placeholder="••••••••" required>
        </div>
        <button class="btn btn-primary" type="submit">Đăng nhập / Login</button>
      </form>
    </div>
  </div>

  <!-- Dashboard Section -->
  <div id="admin-dashboard" class="admin-dashboard">
    <header class="admin-header">
      <div class="admin-user">👋 <span id="admin-email"></span></div>
      <button class="btn btn-outline" id="logout-btn" style="width:auto;padding:8px 16px;font-size:13px">Đăng xuất</button>
    </header>

    <div class="admin-content">
      <div class="admin-card">
        <h2 class="admin-card__title">📋 Chọn vòng đấu / Select Round</h2>
        <select class="form-select" id="round-select">
          <option value="">-- Chọn vòng đấu --</option>
        </select>
      </div>

      <div id="matches-container"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

  <!-- App Scripts -->
  <script src="js/data.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/group-stage.js"></script>
  <script src="js/knockout.js"></script>
  <script src="js/admin.js"></script>

</body>
</html>
