<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VTNet Pickleball Championship 2026</title>
  <meta name="description" content="Kết quả Giải Pickleball Đôi Nam VTNet 2026 - Vòng bảng & Vòng loại trực tiếp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=17">
</head>
<body>

  <!-- Hero Header -->
  <header class="hero">
    <div class="hero-particles">
      <span class="particle" style="--x:10%;--delay:0s;--dur:3.2s;--size:5px;--color:#FFD700"></span>
      <span class="particle" style="--x:20%;--delay:0.5s;--dur:2.8s;--size:3px;--color:#FF6B00"></span>
      <span class="particle" style="--x:32%;--delay:1.1s;--dur:3.5s;--size:6px;--color:#FF0040"></span>
      <span class="particle" style="--x:45%;--delay:0.3s;--dur:2.5s;--size:4px;--color:#FFD700"></span>
      <span class="particle" style="--x:55%;--delay:0.8s;--dur:3.8s;--size:3px;--color:#FF6B00"></span>
      <span class="particle" style="--x:65%;--delay:1.5s;--dur:2.9s;--size:5px;--color:#FFFFFF"></span>
      <span class="particle" style="--x:75%;--delay:0.2s;--dur:3.1s;--size:4px;--color:#FF0040"></span>
      <span class="particle" style="--x:85%;--delay:1.8s;--dur:2.7s;--size:6px;--color:#FFD700"></span>
      <span class="particle" style="--x:90%;--delay:0.6s;--dur:3.4s;--size:3px;--color:#FF6B00"></span>
      <span class="particle" style="--x:5%;--delay:2.0s;--dur:3.0s;--size:4px;--color:#FFFFFF"></span>
      <span class="particle" style="--x:38%;--delay:1.3s;--dur:2.6s;--size:5px;--color:#FFD700"></span>
      <span class="particle" style="--x:58%;--delay:2.2s;--dur:3.6s;--size:3px;--color:#FF0040"></span>
      <span class="particle" style="--x:72%;--delay:0.9s;--dur:2.4s;--size:6px;--color:#FF6B00"></span>
      <span class="particle" style="--x:28%;--delay:1.7s;--dur:3.3s;--size:4px;--color:#FFFFFF"></span>
      <span class="particle" style="--x:48%;--delay:2.5s;--dur:2.8s;--size:5px;--color:#FFD700"></span>
    </div>
    <div class="hero__content">
      <div class="hero__live-badge"><span class="live-dot"></span> LIVE</div>
      <div class="hero__icon">
        <svg id="minigame-ball" class="pickleball-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width: 64px; height: 64px; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.35)); animation: iconSpin 6s ease-in-out infinite; z-index: 9999;">
          <defs>
            <radialGradient id="ballGrad" cx="38%" cy="35%" r="60%">
              <stop offset="0%" stop-color="#f5f542"/>
              <stop offset="50%" stop-color="#d4e020"/>
              <stop offset="100%" stop-color="#8fa800"/>
            </radialGradient>
            <radialGradient id="shinGrad" cx="35%" cy="30%" r="40%">
              <stop offset="0%" stop-color="rgba(255,255,255,0.55)"/>
              <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
            </radialGradient>
          </defs>
          <circle cx="50" cy="50" r="47" fill="url(#ballGrad)"/>
          <circle cx="50" cy="22" r="5" fill="#5a7000" opacity="0.7"/>
          <circle cx="66" cy="28" r="5" fill="#5a7000" opacity="0.7"/>
          <circle cx="75" cy="42" r="5" fill="#5a7000" opacity="0.7"/>
          <circle cx="75" cy="58" r="5" fill="#5a7000" opacity="0.7"/>
          <circle cx="66" cy="72" r="5" fill="#5a7000" opacity="0.7"/>

          <circle cx="25" cy="42" r="5" fill="#5a7000" opacity="0.7"/>
          <circle cx="34" cy="28" r="5" fill="#5a7000" opacity="0.7"/>
          <circle cx="50" cy="38" r="5" fill="#5a7000" opacity="0.7"/>
          <circle cx="62" cy="44" r="5" fill="#5a7000" opacity="0.7"/>
          <circle cx="62" cy="56" r="5" fill="#5a7000" opacity="0.7"/>
          <circle cx="50" cy="62" r="5" fill="#5a7000" opacity="0.7"/>
          <circle cx="38" cy="56" r="5" fill="#5a7000" opacity="0.7"/>
          <circle cx="38" cy="44" r="5" fill="#5a7000" opacity="0.7"/>
          <circle cx="50" cy="50" r="47" fill="url(#shinGrad)"/>
        </svg>
      </div>
      <h1 class="hero__title">VTNET PICKLEBALL<br>CHAMPIONSHIP</h1>
      <p class="hero__subtitle">Giải Pickleball VTNet 2026</p>
      <div class="hero__stats">
        <div class="hero__stat"><span class="hero__stat-num">2026</span><span class="hero__stat-label">Season</span></div>
        <div class="hero__stat-divider"></div>
        <div class="hero__stat"><span class="hero__stat-num">🏆</span><span class="hero__stat-label">Championship</span></div>
        <div class="hero__stat-divider"></div>
        <div class="hero__stat"><span class="hero__stat-num">VTNet</span><span class="hero__stat-label">Official</span></div>
      </div>
    </div>
    <div class="hero__wave">
      <svg viewBox="0 0 1200 80" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0,40 C200,80 400,0 600,40 C800,80 1000,0 1200,40 L1200,80 L0,80 Z" fill="#fff5f8"/>
      </svg>
    </div>
  </header>

  <!-- Category Selection -->
  <div class="category-tabs" id="category-tabs">
    <button class="cat-tab active" data-cat="doi_nam">Nam A</button>
    <button class="cat-tab" data-cat="nam_nu_a">Nam Nữ A</button>
    <button class="cat-tab" data-cat="nam_nu_b">Nam Nữ B</button>
  </div>

  <!-- Main Navigation -->
  <nav class="main-tabs">
    <button class="main-tab active" data-tab="groups">🏅 Vòng Bảng</button>
    <button class="main-tab" data-tab="knockout">🏆 Knock-out</button>
  </nav>

  <!-- Content -->
  <div class="content">
    <section id="groups-section" class="section active">
      <div id="group-stage-content">
        <div class="loading">
          <div class="loading-spinner"></div>
          Đang tải dữ liệu...
        </div>
      </div>
    </section>

    <section id="knockout-section" class="section">
      <div id="knockout-stage-content">
        <div class="loading">
          <div class="loading-spinner"></div>
          Đang tải dữ liệu...
        </div>
      </div>
    </section>
  </div>

  <!-- Footer -->

    <div class="footer__icon" style="margin-bottom: 8px;">

        <circle cx="34" cy="72" r="5" fill="#5a7000" opacity="0.7"/>
        <circle cx="25" cy="58" r="5" fill="#5a7000" opacity="0.7"/>
        <circle cx="25" cy="42" r="5" fill="#5a7000" opacity="0.7"/>
        <circle cx="34" cy="28" r="5" fill="#5a7000" opacity="0.7"/>
        <circle cx="50" cy="38" r="5" fill="#5a7000" opacity="0.7"/>
        <circle cx="62" cy="44" r="5" fill="#5a7000" opacity="0.7"/>
        <circle cx="62" cy="56" r="5" fill="#5a7000" opacity="0.7"/>
        <circle cx="50" cy="62" r="5" fill="#5a7000" opacity="0.7"/>
        <circle cx="38" cy="56" r="5" fill="#5a7000" opacity="0.7"/>
        <circle cx="38" cy="44" r="5" fill="#5a7000" opacity="0.7"/>
        <circle cx="50" cy="50" r="47" fill="url(#shinGrad)"/>
      </svg>
    </div>
    <p class="footer__title">VTNet Pickleball Championship 2026</p>
    <p class="footer__copy">© 2026 VTNet. All rights reserved.</p>
    <div style="margin-top: 20px;">
      <a href="admin.html" style="display:inline-block; text-decoration:none; padding: 6px 18px; border-radius: 20px; font-weight: 600; font-size: 13px; color: #fff; background: linear-gradient(135deg, #FF0040, #FF6B8A); box-shadow: 0 4px 10px rgba(255,0,64,0.3); letter-spacing: 0.3px;">⚡ Cập nhật kết quả</a>
