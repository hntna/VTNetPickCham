<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🏓 Pickleball Championship</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
    font-family:'Be Vietnam Pro',sans-serif;
}

body{
    background:
    linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.75)),
    url('https://images.unsplash.com/photo-1517649763962-0c623066013b?q=80&w=1600&auto=format&fit=crop');
    background-size:cover;
    background-attachment:fixed;
    min-height:100vh;
}

.card{
    background:rgba(255,255,255,.96);
    border-radius:30px;
    overflow:hidden;
    box-shadow:0 20px 40px rgba(0,0,0,.25);
}

.score-input{
    width:80px;
    height:60px;
    border-radius:18px;
    border:3px solid #16a34a;
    text-align:center;
    font-size:28px;
    font-weight:900;
    color:#166534;
    outline:none;
}

.score-input:focus{
    border-color:#f59e0b;
    transform:scale(1.05);
}

.hero{
    background:linear-gradient(135deg,#16a34a,#059669);
    border-radius:35px;
    padding:40px;
    color:white;
}

.match-box{
    background:#f0fdf4;
    border:2px solid #bbf7d0;
    border-radius:24px;
    padding:18px;
}

.section-title{
    font-size:38px;
    font-weight:900;
    text-align:center;
    margin-bottom:25px;
}

.table-header{
    background:linear-gradient(135deg,#15803d,#166534);
}

.winner-card{
    background:linear-gradient(135deg,#fef9c3,#fde68a);
    border:3px solid #facc15;
}

</style>
</head>

<body class="p-5">

<div class="max-w-7xl mx-auto">

<div class="hero mb-10">

<div class="flex items-center justify-between flex-wrap gap-5">

<div>
<div class="text-5xl font-black">
🏓 PICKLEBALL CHAMPIONSHIP
</div>

<div class="text-xl mt-3 opacity-90">
Quản lý giải đấu chuyên nghiệp
</div>
</div>

<div class="text-8xl">
🏆
</div>

</div>

</div>

<div id="tables" class="grid grid-cols-1 xl:grid-cols-2 gap-8"></div>

<div id="qualified" class="mt-12"></div>

<div id="knockout" class="mt-12"></div>

<div id="quarterfinal" class="mt-12"></div>

<div id="semifinal" class="mt-12"></div>

<div id="finalmatch" class="mt-12"></div>

</div>

<script>

const groups={

A:[
"Ngô Đại Dương / Hà Trọng Trường",
"Lê Văn Bình / Hoàng Xuân Hưng",
"Bùi Mạnh Linh / Dương Minh Thành",
"Vũ Đình Thành / Nguyễn Văn Công"
],

B:[
"Phạm Ngọc Nhật Linh / Nguyễn Quang Long",
"Nguyễn Tiến Đạt / Đặng Thái Sơn",
"Trần Quang Minh / Nguyễn Minh Thuần",
"Đinh Thế Sơn / Nguyễn Công Định"
],

C:[
"Hồ Anh Dũng / Bùi Đức Lâm",
"Dương Đức Thành / Đặng Việt Hải",
"Nguyễn Tuấn Dũng / Nguyễn Nhân Long",
"Phạm Ngọc Thắng / Bùi Doãn Hải"
],

D:[
"Bùi Văn Họa / Hoàng Công Tú",
"Phạm Tuấn Dương / Trần Minh Tiến",
"Nguyễn Tuấn Anh / Nghiêm Chu Hiếu",
"Nguyễn Khắc Phi / Đặng Đình Tài"
],

E:[
"Đặng Hoài Sơn / Trần Văn Luận",
"An Văn Hưởng / Vũ Công Mạnh",
"Đào Đại Nghĩa / Lê Ngọc Nam",
"Nguyễn Khải Hoàn / Vũ Viết Cường"
],

F:[
"Trần Anh Dũng / Nguyễn Hồng Lĩnh",
"Nguyễn Tuấn Tú / Nguyễn Văn Hạnh",
"Đỗ Quang Huy / Nguyễn Văn Thạch",
"Trần Tuấn Trung / Ngô Hùng Cường"
]

};

const scores={};

let renderTimeout=null;

function matchesOf(t){

return[
[t[0],t[1]],
[t[0],t[2]],
[t[0],t[3]],
[t[1],t[2]],
[t[1],t[3]],
[t[2],t[3]]
];

}

function standings(group){

const teams=groups[group];

const table=teams.map(t=>({
team:t,
point:0
}));

matchesOf(teams).forEach((m,index)=>{

const key=`${group}-${index}`;

const s1=parseInt(scores[key]?.s1||0);
const s2=parseInt(scores[key]?.s2||0);

if(s1>s2){
table.find(x=>x.team===m[0]).point++;
}
else if(s2>s1){
table.find(x=>x.team===m[1]).point++;
}

});

table.sort((a,b)=>b.point-a.point);

return table;

}

function updateScore(key,side,value){

if(value===""){
value="";
}

if(value!==""){

value=parseInt(value);

if(isNaN(value)){
value="";
}

if(value<0){
value=0;
}

const isGroupStage=
key.includes("A-") ||
key.includes("B-") ||
key.includes("C-") ||
key.includes("D-") ||
key.includes("E-") ||
key.includes("F-");

if(isGroupStage && value>11){
value=11;
}

}

if(!scores[key]){
scores[key]={s1:"",s2:""};
}

scores[key][side]=value;

clearTimeout(renderTimeout);

renderTimeout=setTimeout(()=>{

render();

},300);

}

function getWinner(key,t1,t2){

const s1=parseInt(scores[key]?.s1||0);
const s2=parseInt(scores[key]?.s2||0);

if(s1>s2)return t1;
if(s2>s1)return t2;

return "-";

}

function nextRound(){

return{
A:standings("A").slice(0,3),
B:standings("B").slice(0,3),
C:standings("C").slice(0,3),
D:standings("D").slice(0,3),
E:standings("E").slice(0,2),
F:standings("F").slice(0,2)
};

}

function knockoutMatches(){

const n=nextRound();

return[
["Trận 1",n.A[0]?.team,n.B[2]?.team],
["Trận 2",n.B[0]?.team,n.A[2]?.team],
["Trận 3",n.A[1]?.team,n.B[1]?.team],
["Trận 4",n.E[0]?.team,n.F[1]?.team],

["Trận 5",n.C[0]?.team,n.D[2]?.team],
["Trận 6",n.D[0]?.team,n.C[2]?.team],
["Trận 7",n.C[1]?.team,n.D[1]?.team],
["Trận 8",n.F[0]?.team,n.E[1]?.team]
];

}

function matchCard(match,key,winner,color){

return`

<div class="match-box">

<div class="bg-${color}-600 text-white inline-block px-4 py-2 rounded-full font-black mb-5">
${match[0]}
</div>

<div class="space-y-5">

<div class="bg-white rounded-2xl p-4">

<div class="font-black text-gray-800 mb-4 text-lg">
🏓 ${match[1]}
</div>

<input
type="number"
min="0"
class="score-input"
value="${scores[key]?.s1||''}"
oninput="updateScore('${key}','s1',this.value)"
>

</div>

<div class="text-center text-red-500 font-black text-3xl">
VS
</div>

<div class="bg-white rounded-2xl p-4">

<div class="font-black text-gray-800 mb-4 text-lg">
🏓 ${match[2]}
</div>

<input
type="number"
min="0"
class="score-input"
value="${scores[key]?.s2||''}"
oninput="updateScore('${key}','s2',this.value)"
>

</div>

<div class="winner-card rounded-2xl p-5 text-center">

<div class="text-gray-600 font-bold">
ĐỘI THẮNG
</div>

<div class="text-2xl font-black text-yellow-700 mt-3">
${winner}
</div>

</div>

</div>

</div>

`;

}

function render(){

renderGroups();
renderQualified();
renderKnockout();
renderQuarter();
renderSemi();
renderFinal();

}

function renderGroups(){

const container=document.getElementById("tables");

container.innerHTML="";

Object.keys(groups).forEach((g,i)=>{

const teams=groups[g];
const matches=matchesOf(teams);
const table=standings(g);

let html=`

<div class="card">

<div class="bg-gradient-to-r from-green-700 to-emerald-500 p-6 text-white">

<div class="flex items-center justify-between">

<div>

<div class="text-3xl font-black">
🏓 BẢNG ${i+1}
</div>

<div class="opacity-90 mt-2">
Thi đấu vòng tròn
</div>

</div>

<div class="text-6xl opacity-30">
🏆
</div>

</div>

</div>

<div class="p-6">

<div class="space-y-5">
`;

matches.forEach((m,index)=>{

const key=`${g}-${index}`;

html+=`

<div class="match-box">

<div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-center">

<div class="font-bold text-gray-800 text-lg">
🏓 ${m[0]}
</div>

<div class="flex items-center justify-center gap-3">

<input
type="number"
min="0"
max="11"
class="score-input"
value="${scores[key]?.s1||''}"
oninput="updateScore('${key}','s1',this.value)"
>

<div class="text-red-500 text-2xl font-black">
VS
</div>

<input
type="number"
min="0"
max="11"
class="score-input"
value="${scores[key]?.s2||''}"
oninput="updateScore('${key}','s2',this.value)"
>

</div>

<div class="font-bold text-gray-800 text-lg text-right">
🏓 ${m[1]}
</div>

</div>

</div>

`;

});

html+=`

</div>

<div class="mt-8 overflow-hidden rounded-2xl border">

<table class="w-full">

<tr class="table-header text-white">

<th class="p-4">#</th>
<th class="p-4 text-left">Đội</th>
<th class="p-4">Điểm</th>

</tr>
`;

table.forEach((t,index)=>{

html+=`

<tr class="border-b hover:bg-green-50 transition">

<td class="p-4 text-center font-black text-xl">
${index+1}
</td>

<td class="p-4 font-bold text-gray-800">
🏓 ${t.team}
</td>

<td class="p-4 text-center">

<div class="w-12 h-12 rounded-full bg-green-600 text-white flex items-center justify-center font-black mx-auto">
${t.point}
</div>

</td>

</tr>

`;

});

html+=`

</table>

</div>

</div>

</div>
`;

container.innerHTML+=html;

});

}

function renderQualified(){

const container=document.getElementById("qualified");

const next=nextRound();

let html=`

<div class="card p-8">

<div class="section-title text-green-700">
🏆 ĐỘI ĐI TIẾP
</div>

<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
`;

Object.keys(next).forEach(g=>{

html+=`

<div class="bg-green-50 rounded-3xl p-5">

<div class="text-2xl font-black text-green-700 mb-5">
Bảng ${g}
</div>
`;

next[g].forEach((t,index)=>{

html+=`

<div class="winner-card rounded-2xl p-4 mb-4">

<div class="flex justify-between items-center">

<div class="font-black text-gray-800">
🏓 ${t.team}
</div>

<div class="text-3xl">
${index===0?'🥇':'🥈'}
</div>

</div>

</div>

`;

});

html+=`</div>`;

});

html+=`</div></div>`;

container.innerHTML=html;

}

function renderKnockout(){

const container=document.getElementById("knockout");

const matches=knockoutMatches();

let html=`

<div class="card p-8">

<div class="section-title text-red-600">
🔥 VÒNG 1/16
</div>

<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
`;

matches.forEach((m,index)=>{

const key=`ko-${index}`;

const winner=getWinner(key,m[1],m[2]);

html+=matchCard(m,key,winner,"red");

});

html+=`</div></div>`;

container.innerHTML=html;

}

function renderQuarter(){

const container=document.getElementById("quarterfinal");

const matches=[

["Trận 9",
getWinner("ko-0",knockoutMatches()[0][1],knockoutMatches()[0][2]),
getWinner("ko-4",knockoutMatches()[4][1],knockoutMatches()[4][2])],

["Trận 10",
getWinner("ko-1",knockoutMatches()[1][1],knockoutMatches()[1][2]),
getWinner("ko-5",knockoutMatches()[5][1],knockoutMatches()[5][2])],

["Trận 11",
getWinner("ko-2",knockoutMatches()[2][1],knockoutMatches()[2][2]),
getWinner("ko-6",knockoutMatches()[6][1],knockoutMatches()[6][2])],

["Trận 12",
getWinner("ko-3",knockoutMatches()[3][1],knockoutMatches()[3][2]),
getWinner("ko-7",knockoutMatches()[7][1],knockoutMatches()[7][2])]

];

let html=`

<div class="card p-8">

<div class="section-title text-blue-700">
🏆 TỨ KẾT
</div>

<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
`;

matches.forEach((m,index)=>{

const key=`qf-${index}`;

const winner=getWinner(key,m[1],m[2]);

html+=matchCard(m,key,winner,"blue");

});

html+=`</div></div>`;

container.innerHTML=html;

}

function renderSemi(){

const container=document.getElementById("semifinal");

const matches=[

["Trận 13",

getWinner("qf-0",
getWinner("ko-0",knockoutMatches()[0][1],knockoutMatches()[0][2]),
getWinner("ko-4",knockoutMatches()[4][1],knockoutMatches()[4][2])),

getWinner("qf-2",
getWinner("ko-2",knockoutMatches()[2][1],knockoutMatches()[2][2]),
getWinner("ko-6",knockoutMatches()[6][1],knockoutMatches()[6][2]))],

["Trận 14",

getWinner("qf-1",
getWinner("ko-1",knockoutMatches()[1][1],knockoutMatches()[1][2]),
getWinner("ko-5",knockoutMatches()[5][1],knockoutMatches()[5][2])),

getWinner("qf-3",
getWinner("ko-3",knockoutMatches()[3][1],knockoutMatches()[3][2]),
getWinner("ko-7",knockoutMatches()[7][1],knockoutMatches()[7][2]))]

];

let html=`

<div class="card p-8">

<div class="section-title text-purple-700">
🏅 BÁN KẾT
</div>

<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
`;

matches.forEach((m,index)=>{

const key=`sf-${index}`;

const winner=getWinner(key,m[1],m[2]);

html+=matchCard(m,key,winner,"purple");

});

html+=`</div></div>`;

container.innerHTML=html;

}

function renderFinal(){

const container=document.getElementById("finalmatch");

const team1=getWinner("sf-0",

getWinner("qf-0",
getWinner("ko-0",knockoutMatches()[0][1],knockoutMatches()[0][2]),
getWinner("ko-4",knockoutMatches()[4][1],knockoutMatches()[4][2])),

getWinner("qf-2",
getWinner("ko-2",knockoutMatches()[2][1],knockoutMatches()[2][2]),
getWinner("ko-6",knockoutMatches()[6][1],knockoutMatches()[6][2]))

);

const team2=getWinner("sf-1",

getWinner("qf-1",
getWinner("ko-1",knockoutMatches()[1][1],knockoutMatches()[1][2]),
getWinner("ko-5",knockoutMatches()[5][1],knockoutMatches()[5][2])),

getWinner("qf-3",
getWinner("ko-3",knockoutMatches()[3][1],knockoutMatches()[3][2]),
getWinner("ko-7",knockoutMatches()[7][1],knockoutMatches()[7][2]))

);

const champion=getWinner("final",team1,team2);

let html=`

<div class="card p-10">

<div class="section-title text-yellow-500">
🏆 CHUNG KẾT
</div>

<div class="max-w-4xl mx-auto bg-gradient-to-r from-yellow-100 to-orange-100 rounded-[35px] p-10 border-4 border-yellow-400">

<div class="grid grid-cols-1 md:grid-cols-3 gap-8 items-center">

<div class="text-center">

<div class="font-black text-gray-800 text-2xl mb-5">
🏓 ${team1}
</div>

<input
type="number"
min="0"
class="score-input"
value="${scores["final"]?.s1||''}"
oninput="updateScore('final','s1',this.value)"
>

</div>

<div class="text-center text-5xl font-black text-red-500">
VS
</div>

<div class="text-center">

<div class="font-black text-gray-800 text-2xl mb-5">
🏓 ${team2}
</div>

<input
type="number"
min="0"
class="score-input"
value="${scores["final"]?.s2||''}"
oninput="updateScore('final','s2',this.value)"
>

</div>

</div>

<div class="winner-card rounded-[30px] p-8 mt-10 text-center">

<div class="text-gray-600 text-xl font-bold">
🥇 NHÀ VÔ ĐỊCH
</div>

<div class="text-4xl font-black text-yellow-700 mt-5">
${champion}
</div>

</div>

</div>

</div>
`;

container.innerHTML=html;

}

render();

</script>

</body>
</html>
